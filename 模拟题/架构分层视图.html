<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>架构分层视图 · 闪卡</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --line:#e3e8f0;
    --text:#1d2433;
    --sub:#6b7688;
    --accent:#4f5bd5;
    --accent-soft:#eef0ff;
    --v1:#0f9d6e;
    --v1-soft:#e8f7f1;
    --v2:#2f7dd1;
    --v2-soft:#e9f2fd;
    --v3:#a2591c;
    --v3-soft:#fdf1e6;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:28px 16px 60px;
    background:radial-gradient(1200px 600px at 50% -10%, #e8ecff 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:820px;margin:0 auto;}

  header h1{font-size:22px;margin:0 0 6px;letter-spacing:.5px;}
  header p{margin:0 0 18px;color:var(--sub);font-size:13px;}

  .toolbar{
    display:flex;gap:16px;flex-wrap:wrap;align-items:center;
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;
  }
  .stats{display:flex;gap:22px;font-size:12px;color:var(--sub);}
  .stats b{display:block;font-size:17px;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.3;}
  .toolbar .tip{margin-left:auto;font-size:12px;color:#9aa3b4;}

  .stage{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 20px 20px;box-shadow:0 8px 26px -18px rgba(35,50,100,.35);
  }
  .stage-head{text-align:center;padding-bottom:20px;border-bottom:1px dashed var(--line);}
  .prompt{font-size:12px;color:var(--sub);letter-spacing:2px;margin-bottom:12px;}
  .layer-name{
    font-size:clamp(26px,5vw,36px);font-weight:700;line-height:1.3;letter-spacing:1px;
    word-break:break-word;
  }

  .deck{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px;
    perspective:1200px;
  }
  .flip{height:230px;cursor:pointer;}
  .flip-inner{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.1,.2,1);
  }
  .flip.flipped .flip-inner{transform:rotateY(180deg);}
  .deck.no-anim .flip-inner{transition:none;}

  .face{
    position:absolute;inset:0;border-radius:14px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;padding:16px 15px;overflow:hidden;
  }
  .front{
    align-items:center;justify-content:center;gap:10px;
    border:1px solid var(--line);background:#fbfcff;
  }
  .front .tag{font-size:16px;font-weight:700;letter-spacing:1px;}
  .front .cue{font-size:12px;color:#a8b0c0;display:flex;align-items:center;gap:4px;}
  .front .cue::after{content:"⟳";font-size:13px;}

  .flip.c1 .front .tag{color:var(--v1);}
  .flip.c2 .front .tag{color:var(--v2);}
  .flip.c3 .front .tag{color:var(--v3);}
  .flip.c1 .front{background:linear-gradient(180deg,#fbfefc,#f2fbf7);border-color:#d5eee4;}
  .flip.c2 .front{background:linear-gradient(180deg,#fbfdff,#f1f7fd);border-color:#d8e6f5;}
  .flip.c3 .front{background:linear-gradient(180deg,#fffcf9,#fdf5ee);border-color:#f0e0cf;}

  .back{transform:rotateY(180deg);align-items:flex-start;}
  .flip.c1 .back{background:var(--v1-soft);border:1px solid #c6ecdd;}
  .flip.c2 .back{background:var(--v2-soft);border:1px solid #d2e4f7;}
  .flip.c3 .back{background:var(--v3-soft);border:1px solid #efdcc8;}
  .back .tag{font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:8px;flex:none;}
  .flip.c1 .back .tag{color:var(--v1);}
  .flip.c2 .back .tag{color:var(--v2);}
  .flip.c3 .back .tag{color:var(--v3);}

  .back ul{
    list-style:none;margin:0;padding:0;overflow-y:auto;width:100%;
    font-size:14px;line-height:1.5;color:#3c4454;
  }
  .back li{position:relative;padding:0 0 0 13px;margin-bottom:6px;overflow-wrap:anywhere;}
  .back li::before{
    content:"";position:absolute;left:0;top:.6em;
    width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.4;
  }
  .single{
    font-size:14px;line-height:1.7;color:#3c4454;overflow-wrap:anywhere;
  }

  .actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
  button.primary{
    border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:600;
    padding:12px 26px;border-radius:11px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  button.primary:hover{background:#4149bd;}
  button.primary:active{transform:translateY(1px);}
  button.ghost{
    border:1px solid var(--line);background:#fff;color:var(--text);font-size:14px;
    padding:11px 22px;border-radius:11px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  button.ghost:hover{border-color:var(--accent);color:var(--accent);}

  .hint{text-align:center;font-size:12px;color:#9aa3b4;margin-top:14px;}
  .hint kbd{
    font-family:inherit;background:#eef0f6;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:0 5px;font-size:11px;color:#5b6478;
  }

  @media (max-width:640px){
    body{padding:18px 12px 50px;}
    .deck{grid-template-columns:1fr;}
    .flip{height:190px;}
    .toolbar .tip{margin-left:0;width:100%;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>架构分层视图 · 闪卡</h1>
    <p>看层名，先在心里背出作用、典型组件、上下游关系，再逐张翻开对照。进度按洗牌袋轮转，5 个层次全部出完才重开一轮。</p>
  </header>

  <div class="toolbar">
    <div class="stats">
      <div>本轮进度<b id="stRound">1/5</b></div>
      <div>本张已翻开<b id="stReveal">0/3</b></div>
    </div>
    <div class="tip">洗牌袋：每轮 5 个层次随机顺序出现，不重复、不遗漏</div>
  </div>

  <div class="stage">
    <div class="stage-head">
      <div class="prompt" id="prompt">请根据层名背诵该层的关键信息</div>
      <div class="layer-name" id="layerName">—</div>
    </div>

    <div class="deck" id="deck"></div>

    <div class="actions">
      <button class="ghost" id="revealAll">全部翻开</button>
      <button class="primary" id="nextBtn">下一题</button>
    </div>
    <div class="hint">
      点击任意卡片翻开 / 再点收起 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 翻开对应卡片 · <kbd>空格</kbd> 或 <kbd>→</kbd> 下一题
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 题库：来自 案例分析题技巧-必答题.md「架构分层视图」 ---------- */
  var LAYERS = [
    { name:'接入层',
      role:'系统的流量总入口，负责把外部请求安全、均匀地转交给后面的业务服务。',
      parts:['负载均衡','网关','鉴权','流量控制','路由转发'],
      relation:'直接面向用户和外部系统，向下调用业务服务层，不处理具体业务逻辑。' },

    { name:'业务服务层',
      role:'实现核心业务逻辑，并把各项业务能力编排成可调用的服务。',
      parts:['核心业务逻辑','微服务模块编排'],
      relation:'向上接收接入层转发的请求，向下复用中台公共能力、读写数据层。' },

    { name:'中台层',
      role:'沉淀各业务共用的公共能力，避免每个业务系统重复建设。',
      parts:['用户','权限','流程','AI能力'],
      relation:'被业务服务层调用，向下依赖数据层；提供用户、权限、流程、AI 等公共能力。' },

    { name:'数据层',
      role:'负责数据的持久化、缓存、异步消息和知识存储，为上层提供数据支撑。',
      parts:['数据库','缓存','消息队列','知识库','存储'],
      relation:'被业务服务层和中台层读写，自身运行在基础设施层之上。' },

    { name:'基础设施层',
      role:'提供系统运行所需的算力、网络和安全底座，是上面所有层的运行环境。',
      parts:['服务器','容器','云平台','网络','安全设备'],
      relation:'位于最底层，为上层提供运行环境，不感知具体业务。' }
  ];

  var TYPES = [
    { key:'role',     cls:'c1', label:'作用',        single:true  },
    { key:'parts',    cls:'c2', label:'典型组件 / 技术', single:false },
    { key:'relation', cls:'c3', label:'上下游关系',   single:true  }
  ];

  var state = {
    deck: [],       // 洗牌袋：本轮剩余的层次下标
    roundTotal: 0,  // 本轮应出题数
    shown: 0,       // 本轮已出题数
    last: -1,       // 上一题，避免新一轮首题重复
    current: -1
  };

  var $ = function(id){ return document.getElementById(id); };
  var elDeck     = $('deck');
  var elLayerName= $('layerName');
  var elRevealAll= $('revealAll');
  var elNext     = $('nextBtn');

  /* ---------- 抽题：洗牌袋 ---------- */
  function shuffle(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function draw(){
    if(!state.deck.length){
      var indices = [];
      for(var i = 0; i < LAYERS.length; i++) indices.push(i);
      shuffle(indices);
      // 避免与上一题连着重复
      if(indices.length > 1 && indices[0] === state.last){
        var t = indices[0]; indices[0] = indices[1]; indices[1] = t;
      }
      state.deck = indices;
      state.roundTotal = indices.length;
      state.shown = 0;
    }
    state.current = state.deck.shift();
    state.last = state.current;
    state.shown++;
    return LAYERS[state.current];
  }

  /* ---------- 渲染 ---------- */
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  function backHTML(layer, t){
    if(t.single){
      return '<div class="single">' + esc(layer[t.key]) + '</div>';
    }
    return '<ul>' + layer[t.key].map(function(x){
      return '<li>' + esc(x) + '</li>';
    }).join('') + '</ul>';
  }

  function renderDeck(layer){
    elDeck.innerHTML = '';
    TYPES.forEach(function(t, i){
      var flip = document.createElement('div');
      flip.className = 'flip ' + t.cls;
      flip.dataset.idx = i;
      flip.innerHTML =
        '<div class="flip-inner">' +
          '<div class="face front">' +
            '<span class="tag">' + t.label + '</span>' +
            '<span class="cue">点击翻开</span>' +
          '</div>' +
          '<div class="face back">' +
            '<span class="tag">' + t.label + '</span>' +
            backHTML(layer, t) +
          '</div>' +
        '</div>';
      flip.addEventListener('click', function(){ toggleFlip(flip); });
      elDeck.appendChild(flip);
    });
    resetFlips();
  }

  function toggleFlip(flip){
    flip.classList.toggle('flipped');
    syncRevealed();
  }

  function syncRevealed(){
    var n = elDeck.querySelectorAll('.flip.flipped').length;
    $('stReveal').textContent = n + '/3';
  }

  function resetFlips(){
    elDeck.classList.add('no-anim');
    Array.prototype.forEach.call(elDeck.querySelectorAll('.flip'), function(f){
      f.classList.remove('flipped');
    });
    void elDeck.offsetHeight;
    elDeck.classList.remove('no-anim');
    syncRevealed();
  }

  function nextCard(){
    var layer = draw();
    elLayerName.textContent = layer.name;
    renderDeck(layer);
    $('stRound').textContent = state.shown + '/' + state.roundTotal;
  }

  /* ---------- 事件 ---------- */
  elNext.addEventListener('click', nextCard);

  elRevealAll.addEventListener('click', function(){
    var flips = elDeck.querySelectorAll('.flip');
    var allOpen = elDeck.querySelectorAll('.flip.flipped').length === flips.length;
    Array.prototype.forEach.call(flips, function(f){
      f.classList.toggle('flipped', !allOpen);
    });
    syncRevealed();
  });

  document.addEventListener('keydown', function(e){
    if(e.target && e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
    if(e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter'){
      e.preventDefault();
      nextCard();
    }else if(e.key === '1' || e.key === '2' || e.key === '3'){
      var flip = elDeck.querySelector('.flip[data-idx="' + (Number(e.key) - 1) + '"]');
      if(flip) toggleFlip(flip);
    }
  });

  /* ---------- 启动 ---------- */
  nextCard();
})();
</script>
</body>
</html>
