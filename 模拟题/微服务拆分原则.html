<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微服务拆分原则 · 闪卡</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --line:#e3e8f0;
    --text:#1d2433;
    --sub:#6b7688;
    --accent:#4f5bd5;
    --v1:#0f9d6e;
    --v1-soft:#e8f7f1;
    --v2:#a2591c;
    --v2-soft:#fdf1e6;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:28px 16px 60px;
    background:radial-gradient(1200px 600px at 50% -10%, #e8ecff 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:820px;margin:0 auto;}

  header h1{font-size:22px;margin:0 0 6px;letter-spacing:.5px;}
  header p{margin:0 0 18px;color:var(--sub);font-size:13px;}

  .toolbar{
    display:flex;gap:16px;flex-wrap:wrap;align-items:center;
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;
  }
  .stats{display:flex;gap:22px;font-size:12px;color:var(--sub);}
  .stats b{display:block;font-size:17px;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.3;}
  .toolbar .tip{margin-left:auto;font-size:12px;color:#9aa3b4;}

  .stage{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 20px 20px;box-shadow:0 8px 26px -18px rgba(35,50,100,.35);
  }
  .stage-head{text-align:center;padding-bottom:20px;border-bottom:1px dashed var(--line);}
  .prompt{font-size:12px;color:var(--sub);letter-spacing:2px;margin-bottom:12px;}
  .principle-name{
    font-size:clamp(26px,5vw,36px);font-weight:700;line-height:1.3;letter-spacing:1px;
    word-break:break-word;
  }
  .mnemonic{font-size:12px;color:#9aa3b4;margin-top:10px;letter-spacing:1px;}

  .deck{
    display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px;
    perspective:1200px;
  }
  .flip{height:240px;cursor:pointer;}
  .flip-inner{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.1,.2,1);
  }
  .flip.flipped .flip-inner{transform:rotateY(180deg);}
  .deck.no-anim .flip-inner{transition:none;}

  .face{
    position:absolute;inset:0;border-radius:14px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;padding:16px 15px;overflow:hidden;
  }
  .front{
    align-items:center;justify-content:center;gap:10px;
    border:1px solid var(--line);background:#fbfcff;
  }
  .front .tag{font-size:16px;font-weight:700;letter-spacing:1px;}
  .front .cue{font-size:12px;color:#a8b0c0;display:flex;align-items:center;gap:4px;}
  .front .cue::after{content:"⟳";font-size:13px;}

  .flip.c1 .front .tag{color:var(--v1);}
  .flip.c2 .front .tag{color:var(--v2);}
  .flip.c1 .front{background:linear-gradient(180deg,#fbfefc,#f2fbf7);border-color:#d5eee4;}
  .flip.c2 .front{background:linear-gradient(180deg,#fffcf9,#fdf5ee);border-color:#f0e0cf;}

  .back{transform:rotateY(180deg);align-items:flex-start;}
  .flip.c1 .back{background:var(--v1-soft);border:1px solid #c6ecdd;}
  .flip.c2 .back{background:var(--v2-soft);border:1px solid #efdcc8;}
  .back .tag{font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:8px;flex:none;}
  .flip.c1 .back .tag{color:var(--v1);}
  .flip.c2 .back .tag{color:var(--v2);}
  .single{
    font-size:14px;line-height:1.7;color:#3c4454;overflow-wrap:anywhere;
  }

  .actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
  button.primary{
    border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:600;
    padding:12px 26px;border-radius:11px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  button.primary:hover{background:#4149bd;}
  button.primary:active{transform:translateY(1px);}
  button.ghost{
    border:1px solid var(--line);background:#fff;color:var(--text);font-size:14px;
    padding:11px 22px;border-radius:11px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  button.ghost:hover{border-color:var(--accent);color:var(--accent);}

  .hint{text-align:center;font-size:12px;color:#9aa3b4;margin-top:14px;}
  .hint kbd{
    font-family:inherit;background:#eef0f6;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:0 5px;font-size:11px;color:#5b6478;
  }

  @media (max-width:640px){
    body{padding:18px 12px 50px;}
    .deck{grid-template-columns:1fr;}
    .flip{height:220px;}
    .toolbar .tip{margin-left:0;width:100%;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>微服务拆分原则 · 闪卡</h1>
    <p>看原则名称，先在心里背出含义和记忆锚点，再逐张翻开对照。进度按洗牌袋轮转，5 条原则全部出完才重开一轮。</p>
  </header>

  <div class="toolbar">
    <div class="stats">
      <div>本轮进度<b id="stRound">1/5</b></div>
      <div>本张已翻开<b id="stReveal">0/2</b></div>
    </div>
    <div class="tip">洗牌袋：每轮 5 条原则随机顺序出现，不重复、不遗漏</div>
  </div>

  <div class="stage">
    <div class="stage-head">
      <div class="prompt">请根据原则名称背诵其含义与记忆锚点</div>
      <div class="principle-name" id="principleName">—</div>
      <div class="mnemonic">口诀：丹高树团叶</div>
    </div>

    <div class="deck" id="deck"></div>

    <div class="actions">
      <button class="ghost" id="revealAll">全部翻开</button>
      <button class="primary" id="nextBtn">下一题</button>
    </div>
    <div class="hint">
      点击任意卡片翻开 / 再点收起 · <kbd>1</kbd><kbd>2</kbd> 翻开对应卡片 · <kbd>空格</kbd> 或 <kbd>→</kbd> 下一题
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 题库：来自 案例分析题技巧-选答题.md「微服务拆分的原则和依据」 ---------- */
  var ITEMS = [
    { name:'单一职责原则',
      meaning:'每个服务只负责一个业务领域的功能。',
      anchor:'丹 → 单：一个服务只围绕一个业务领域，不把订单、库存、用户塞进同一个服务。' },

    { name:'高内聚低耦合原则',
      meaning:'服务内部紧密相关，服务之间松耦合。',
      anchor:'高 → 高内聚：服务内功能要抱团，服务间只通过清晰接口依赖。' },

    { name:'数据自治原则',
      meaning:'每个服务拥有自己的数据库，避免跨服务数据库访问。',
      anchor:'树 → 数：自己的数据自己管，别的服务只能调接口，不能直连你的库。' },

    { name:'团队边界原则',
      meaning:'服务划分与团队组织架构对齐（康威定律）。',
      anchor:'团 → 团队：按团队分工切服务，一个团队负责的服务边界清晰。' },

    { name:'业务粒度原则',
      meaning:'粒度适中，避免过粗导致单体化，过细导致复杂度上升。',
      anchor:'叶 → 业：粒度像树叶，不大不小；过粗变单体，过细运维爆炸。' }
  ];

  var TYPES = [
    { key:'meaning', cls:'c1', label:'原则含义', single:true },
    { key:'anchor',  cls:'c2', label:'记忆锚点', single:true }
  ];

  var state = {
    deck: [],
    roundTotal: 0,
    shown: 0,
    last: -1,
    current: -1
  };

  var $ = function(id){ return document.getElementById(id); };
  var elDeck       = $('deck');
  var elPrinciple  = $('principleName');
  var elRevealAll  = $('revealAll');
  var elNext       = $('nextBtn');

  /* ---------- 抽题：洗牌袋 ---------- */
  function shuffle(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function draw(){
    if(!state.deck.length){
      var indices = [];
      for(var i = 0; i < ITEMS.length; i++) indices.push(i);
      shuffle(indices);
      // 避免与上一题连着重复
      if(indices.length > 1 && indices[0] === state.last){
        var t = indices[0]; indices[0] = indices[1]; indices[1] = t;
      }
      state.deck = indices;
      state.roundTotal = indices.length;
      state.shown = 0;
    }
    state.current = state.deck.shift();
    state.last = state.current;
    state.shown++;
    return ITEMS[state.current];
  }

  /* ---------- 渲染 ---------- */
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  function renderDeck(item){
    elDeck.innerHTML = '';
    TYPES.forEach(function(t, i){
      var flip = document.createElement('div');
      flip.className = 'flip ' + t.cls;
      flip.dataset.idx = i;
      flip.innerHTML =
        '<div class="flip-inner">' +
          '<div class="face front">' +
            '<span class="tag">' + t.label + '</span>' +
            '<span class="cue">点击翻开</span>' +
          '</div>' +
          '<div class="face back">' +
            '<span class="tag">' + t.label + '</span>' +
            '<div class="single">' + esc(item[t.key]) + '</div>' +
          '</div>' +
        '</div>';
      flip.addEventListener('click', function(){ toggleFlip(flip); });
      elDeck.appendChild(flip);
    });
    resetFlips();
  }

  function toggleFlip(flip){
    flip.classList.toggle('flipped');
    syncRevealed();
  }

  function syncRevealed(){
    var n = elDeck.querySelectorAll('.flip.flipped').length;
    $('stReveal').textContent = n + '/2';
  }

  function resetFlips(){
    elDeck.classList.add('no-anim');
    Array.prototype.forEach.call(elDeck.querySelectorAll('.flip'), function(f){
      f.classList.remove('flipped');
    });
    void elDeck.offsetHeight;
    elDeck.classList.remove('no-anim');
    syncRevealed();
  }

  function nextCard(){
    var item = draw();
    elPrinciple.textContent = item.name;
    renderDeck(item);
    $('stRound').textContent = state.shown + '/' + state.roundTotal;
  }

  /* ---------- 事件 ---------- */
  elNext.addEventListener('click', nextCard);

  elRevealAll.addEventListener('click', function(){
    var flips = elDeck.querySelectorAll('.flip');
    var allOpen = elDeck.querySelectorAll('.flip.flipped').length === flips.length;
    Array.prototype.forEach.call(flips, function(f){
      f.classList.toggle('flipped', !allOpen);
    });
    syncRevealed();
  });

  document.addEventListener('keydown', function(e){
    if(e.target && e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
    if(e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter'){
      e.preventDefault();
      nextCard();
    }else if(e.key === '1' || e.key === '2'){
      var flip = elDeck.querySelector('.flip[data-idx="' + (Number(e.key) - 1) + '"]');
      if(flip) toggleFlip(flip);
    }
  });

  /* ---------- 启动 ---------- */
  nextCard();
})();
</script>
</body>
</html>
